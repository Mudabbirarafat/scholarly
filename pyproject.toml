[project]
name = "scholarly"
version = "0.1.0"
description = "Semantic search over CS paper abstracts, with a published evaluation that gates the deploy"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# The serving side. `fastembed` lives here rather than in the core
# dependencies because ingest, indexing and evaluation all run without it,
# and it pulls ONNX Runtime - which is most of the install.
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastembed>=0.4.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "psutil>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
