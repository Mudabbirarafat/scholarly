name: Pipeline

# The expensive half of the system, run where the compute is free.
#
# Measured on the development laptop: 3.8 abstracts a second with every core
# busy, which is 8.3 hours for the corpus. That number is the reason this
# workflow exists rather than a convenience - a free serving instance has
# 512 MB and cannot hold a transformer at all, while a public repository gets
# 4 cores and 16 GB here for nothing.
#
# Manual and weekly, never on push: this takes hours and nobody wants it
# attached to a typo fix.

on:
  workflow_dispatch:
    inputs:
      documents:
        # Empty by default, and it has to stay empty: GitHub substitutes a
        # declared default whenever the box is left blank, so a default of
        # '20000' made "blank for the whole corpus" impossible to ask for -
        # the first full-encode run quietly encoded 20,000 again and the
        # coverage guard was the only thing that noticed.
        description: Documents to encode (blank encodes the whole corpus)
        required: false
        default: ''
  schedule:
    # Sunday, early. Off the hour because everyone else uses the hour.
    - cron: '41 3 * * 0'

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # under the 6h ceiling, with room to report
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DATABASE_URL: sqlite:///pipeline.db
      RAW_DIR: /tmp/scholarly-raw

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" fastembed numpy

      - name: Ingest the query population
        run: python -m scholarly.cli ingest --from-year 2018 --to-year 2021

      - name: Ingest older documents
        # References point backwards in time, so the document corpus has to
        # reach further back than the query set or most of the ground truth
        # is unretrievable by construction.
        run: python -m scholarly.cli ingest --from-year 2012 --to-year 2017 --documents-only

      - name: Build the lexical index
        run: python -m scholarly.cli index --rebuild

      - name: Freeze the evaluation set
        run: python -m scholarly.cli freeze --size 2000 | tee freeze.json

      - name: Encode
        run: |
          python -m scholarly.cli embed \
            ${{ github.event.inputs.documents && format('--limit {0}', github.event.inputs.documents) || '' }} \
            --batch-size 64

      - name: Evaluate both retrievers on the dev split
        run: |
          python -m scholarly.cli eval --split dev --retriever lexical | tee lexical.json
          python -m scholarly.cli eval --split dev --retriever dense   | tee dense.json

      - name: The gate
        # A rebuild that retrieves worse than the lexical floor does not get
        # published. Beating BM25 is the whole claim a dense retriever makes;
        # if it cannot, the honest outcome is a red build, not a quiet one.
        #
        # But the comparison is only fair when both retrievers can reach the
        # same documents. A partial encode searches a smaller index than BM25
        # does, so dense loses for a reason that has nothing to do with
        # retrieval quality - the run still reports both numbers, and says
        # plainly that it is not a verdict.
        run: |
          python - <<'EOF'
          import json, sqlite3, sys
          lex = json.load(open("lexical.json"))
          dense = json.load(open("dense.json"))
          db = sqlite3.connect("pipeline.db")
          total = db.execute(
              "SELECT COUNT(*) FROM papers WHERE abstract IS NOT NULL").fetchone()[0]
          encoded = dense.get("index_size", 0)

          print(f"lexical recall@10 {lex['recall@10']}")
          print(f"dense   recall@10 {dense['recall@10']}  over {encoded:,} of {total:,}")

          if dense["queries"] == 0:
              sys.exit("dense evaluated nothing")

          if encoded < total * 0.99:
              print(
                  f"::notice::partial index ({encoded:,}/{total:,}); "
                  "the comparison is indicative, not a verdict, so the gate is skipped"
              )
              raise SystemExit(0)

          if dense["recall@10"] < lex["recall@10"]:
              sys.exit(
                  f"dense ({dense['recall@10']}) did not beat lexical ({lex['recall@10']})"
              )
          EOF

      - name: Publish the measurement the UI reads
        # The interface shows these numbers and says which run produced them.
        # Writing the file here, from the same JSON the gate judged, is what
        # keeps the published claim and the gated claim the same claim.
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import json, os, sqlite3, datetime

          lex = json.load(open("lexical.json"))
          dense = json.load(open("dense.json"))
          frozen = json.load(open("freeze.json"))
          coverage = dense.get("coverage", {})

          db = sqlite3.connect("pipeline.db")
          documents = db.execute(
              "SELECT COUNT(*) FROM papers WHERE abstract IS NOT NULL").fetchone()[0]

          def metrics(source):
              keys = ("recall@10", "recall@50", "mrr@50", "p50_ms", "p95_ms", "index_size")
              return {k: source[k] for k in keys if k in source}

          quality = {
              "run": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "commit": os.environ["COMMIT"][:7],
              "measured_at": datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds"),
              "corpus": {
                  "documents": documents,
                  "citation_edges": coverage.get("citation_edges"),
                  "retrievable": coverage.get("retrievable"),
                  "retrievable_pct": coverage.get("retrievable_pct"),
              },
              "queries": {
                  "split": dense.get("split"),
                  "count": dense.get("queries"),
                  "relevant_per_query": dense.get("relevant_per_query"),
                  "pool": frozen.get("pool"),
                  "skipped": dense.get("skipped"),
              },
              "lexical": metrics(lex),
              "dense": metrics(dense),
              "note": (
                  "Measured by the pipeline against a frozen query set. Not recomputed at "
                  "serving time: a number produced by a web process against whatever it "
                  "happens to hold would look identical and mean nothing."
              ),
          }
          os.makedirs("data", exist_ok=True)
          with open("data/quality.json", "w", encoding="utf-8") as handle:
              json.dump(quality, handle, indent=2)
          print(json.dumps(quality, indent=2))
          EOF

      - name: Build the serving bundle
        # What a deployed instance actually reads: papers, vectors, a
        # full-text index, and none of the 2.6 million citation edges.
        run: python -m scholarly.cli bundle --out data/serving.db --limit 5000

      - name: Keep the vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: |
            pipeline.db
            lexical.json
            dense.json
            data/quality.json
            data/serving.db
          retention-days: 14
