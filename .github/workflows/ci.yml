name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  # The suite mocks OpenAlex, so this job is the one that notices when the API
  # changes shape underneath us - which it already has once: cursor paging
  # started requiring a key partway through building this.
  #
  # It needs the OPENALEX_API_KEY repository secret. Until that exists the job
  # skips rather than failing, because a red badge for missing configuration
  # teaches the reader nothing.
  live-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      - name: Is a key configured?
        id: key
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: echo "present=${OPENALEX_API_KEY:+yes}" >> "$GITHUB_OUTPUT"

      - name: Ingest one real month and check it is complete
        if: steps.key.outputs.present == 'yes'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          DATABASE_URL: sqlite:///smoke.db
          RAW_DIR: /tmp/scholarly-raw
        run: |
          python -m scholarly.cli ingest --from-year 2018 --to-year 2018 > summary.json
          cat summary.json
          python - <<'EOF'
          import json, sqlite3, sys
          s = json.load(open("summary.json"))
          # The completeness gate is the point of this job: a truncated walk
          # must fail the build rather than publish a half corpus.
          if s["status"] != "succeeded":
              sys.exit(f"ingest incomplete: {s['incomplete_slices']}")
          db = sqlite3.connect("smoke.db")
          papers, edges = (db.execute(q).fetchone()[0] for q in
                           ("SELECT COUNT(*) FROM papers", "SELECT COUNT(*) FROM citations"))
          print(f"papers={papers} citations={edges}")
          assert papers > 5000, papers
          assert edges > papers, (papers, edges)
          # Every paper must carry the abstract the filter promised.
          missing = db.execute("SELECT COUNT(*) FROM papers WHERE abstract IS NULL").fetchone()[0]
          assert missing == 0, f"{missing} papers without an abstract"
          EOF
